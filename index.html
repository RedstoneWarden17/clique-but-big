<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archipelago WebSocket Client</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; line-height: 1.5; }
        .field { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:disabled { background: #ccc; }
        #goalBtn { background: #28a745; margin-top: 15px; width: 100%; font-size: 16px; }
        #status { padding: 10px; margin-top: 15px; border-radius: 4px; font-weight: bold; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .connected { background: #d4edda; color: #155724; }
        .connecting { background: #fff3cd; color: #856404; }
        #log { background: #eee; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 12px; margin-top: 15px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Archipelago WebSocket Client</h2>
    
    <div class="field">
        <label for="protocol">Protocol</label>
        <select id="protocol">
            <option value="ws://">ws:// (Unsecure - Requires HTTP page load)</option>
            <option value="wss://">wss:// (Secure)</option>
        </select>
    </div>

    <div class="field">
        <label for="host">Host / IP</label>
        <input type="text" id="host" placeholder="localhost or archipelago.gg">
    </div>

    <div class="field">
        <label for="port">Port</label>
        <input type="number" id="port" placeholder="38281">
    </div>

    <button id="connectBtn" onclick="toggleConnection()">Connect</button>

    <div id="status" class="disconnected">Status: Disconnected</div>

    <button id="goalBtn" onclick="sendGoalUpdate()" disabled>⚡ Send Goal Completed Packet</button>

    <h3>Connection Log</h3>
    <div id="log"></div>

    <script>
        let ws = null;
        let reconnectInterval = null;
        let isForcedClose = false;

        // Load saved connection settings
        window.onload = function() {
            if(localStorage.getItem('ap_protocol')) document.getElementById('protocol').value = localStorage.getItem('ap_protocol');
            if(localStorage.getItem('ap_host')) document.getElementById('host').value = localStorage.getItem('ap_host');
            if(localStorage.getItem('ap_port')) document.getElementById('port').value = localStorage.getItem('ap_port');
            logMessage("Saved settings loaded. Ensure you are on http:// (not https://) if using ws://");
        };

        function logMessage(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateUIState(state) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const goalBtn = document.getElementById('goalBtn');

            statusDiv.className = state;
            if (state === 'connected') {
                statusDiv.innerText = "Status: Connected";
                connectBtn.innerText = "Disconnect";
                goalBtn.disabled = false;
            } else if (state === 'connecting') {
                statusDiv.innerText = "Status: Connecting...";
                connectBtn.innerText = "Cancel";
                goalBtn.disabled = true;
            } else {
                statusDiv.innerText = "Status: Disconnected";
                connectBtn.innerText = "Connect";
                goalBtn.disabled = true;
            }
        }

        function toggleConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                isForcedClose = true;
                clearInterval(reconnectInterval);
                ws.close();
                logMessage("Connection cancelled by user.");
            } else {
                isForcedClose = false;
                saveSettings();
                connect();
            }
        }

        function saveSettings() {
            localStorage.setItem('ap_protocol', document.getElementById('protocol').value);
            localStorage.setItem('ap_host', document.getElementById('host').value);
            localStorage.setItem('ap_port', document.getElementById('port').value);
        }

        function connect() {
            if (ws) { ws.close(); }

            const protocol = document.getElementById('protocol').value;
            const host = document.getElementById('host').value;
            const port = document.getElementById('port').value;
            
            if (!host || !port) {
                alert("Please enter both a host and a port.");
                return;
            }

            const url = `${protocol}${host}:${port}`;
            logMessage(`Attempting connection to ${url}...`);
            updateUIState('connecting');

            try {
                ws = new WebSocket(url);

                ws.onopen = function() {
                    logMessage("Connected successfully!");
                    updateUIState('connected');
                    clearInterval(reconnectInterval); // Stop trying to reconnect while healthy
                };

                ws.onmessage = function(event) {
                    logMessage(`Received server data: ${event.data}`);
                };

                ws.onclose = function(event) {
                    updateUIState('disconnected');
                    if (!isForcedClose) {
                        logMessage("Connection lost. Retrying in 3 seconds...");
                        // Trigger reconnection loop if not already running
                        clearInterval(reconnectInterval);
                        reconnectInterval = setInterval(connect, 3000);
                    } else {
                        logMessage("Disconnected.");
                    }
                };

                ws.onerror = function(err) {
                    logMessage("WebSocket encountered an error.");
                };

            } catch (e) {
                logMessage(`Error creating WebSocket: ${e.message}`);
                updateUIState('disconnected');
            }
        }

        function sendGoalUpdate() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                // Standard Archipelago payload payload for updating room client status to CLIENT_GOAL (30)
                const packet = [{"cmd": "StatusUpdate", "status": 30}];
                ws.send(JSON.stringify(packet));
                logMessage("Sent: StatusUpdate (Goal Completed)");
            } else {
                logMessage("Cannot send packet: WebSocket is not connected.");
            }
        }
    </script>
</body>
</html>
