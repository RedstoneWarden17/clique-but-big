<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clique</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="login-screen" class="screen">
      <h1>Clique</h1>
      <p>Archipelago Client</p>

      <label>
        Server
        <input id="server" value="archipelago.gg:38281" autocomplete="off">
      </label>

      <label>
        Slot
        <input id="slot" placeholder="Your slot name" autocomplete="off">
      </label>

      <label>
        Password
        <input id="password" type="password" autocomplete="off">
      </label>

      <button id="connect">Connect</button>
      <p id="status" class="status">Disconnected</p>
    </section>

    <section id="game-screen" class="screen hidden">
      <header>
        <div>
          <h1>Clique</h1>
          <p id="progress">0 / 100</p>
        </div>
        <button id="disconnect" class="secondary">Disconnect</button>
      </header>

      <div id="board" class="board" aria-label="Clique button board"></div>
      <p id="log" class="log"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
